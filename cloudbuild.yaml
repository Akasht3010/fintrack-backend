# Cloud Build pipeline: build the Expo web export from the frontend repo,
# bake it + the API into one image, deploy to Cloud Run.
#
# Wire this to a trigger on pushes to main. Set these substitution variables
# on the trigger (see DEPLOY_GCP.md):
#   _REGION         e.g. asia-south1
#   _SERVICE        Cloud Run service name, e.g. fintrack
#   _AR_REPO        Artifact Registry repo name, e.g. fintrack
#   _SQL_INSTANCE   Cloud SQL connection name  PROJECT:REGION:INSTANCE
#   _APP_URL        public https origin the app is served on, e.g. https://fintrack.example.com
#   _FRONTEND_REPO  git URL of the Expo app repo

substitutions:
  _REGION: asia-south1
  _SERVICE: fintrack
  _AR_REPO: fintrack
  _SQL_INSTANCE: ""
  _APP_URL: ""
  _FRONTEND_REPO: "https://github.com/Akasht3010/fintrack.git"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 1. Build the web bundle from the frontend repo, pointed at the deployed API.
  - id: web-export
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        git clone --depth 1 "${_FRONTEND_REPO}" /frontend
        cd /frontend
        npm ci
        node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.extra.apiUrl='${_APP_URL}';fs.writeFileSync('app.json',JSON.stringify(j,null,2))"
        npx expo export -p web
        rm -rf /workspace/web && mv dist /workspace/web

  # 2. Build + push the image.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}']

  # 3. Deploy. Non-secret config is inline; secrets come from Secret Manager.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=4
      - --set-env-vars=ENV=production,ACCESS_TOKEN_EXPIRE_MINUTES=30,OTP_EXPIRE_MINUTES=5,OTP_RESEND_COOLDOWN_SECONDS=30,PUBLIC_BASE_URL=${_APP_URL},CORS_ORIGINS=${_APP_URL},SMTP_HOST=smtp.gmail.com,SMTP_PORT=587
      - --set-secrets=DATABASE_URL=fintrack-database-url:latest,SECRET_KEY=fintrack-secret-key:latest,ENCRYPTION_KEY=fintrack-encryption-key:latest,GOOGLE_CLIENT_ID=fintrack-google-client-id:latest,GOOGLE_CLIENT_SECRET=fintrack-google-client-secret:latest,SMTP_USER=fintrack-smtp-user:latest,SMTP_PASSWORD=fintrack-smtp-password:latest,SMTP_FROM=fintrack-smtp-from:latest,ADMIN_API_KEY=fintrack-admin-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
